<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Tudo Sobre Batatas</title>
</head>
<body>

  <!-- Cabeçalho principal do site -->
  <header>
    <h1>Batatas</h1>
    <!-- Menu de navegação entre as páginas -->
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- Conteúdo principal da página -->
  <main>
    <section>
      <h2>Fale Conosco</h2>
      <p>Ficou com alguma duvida, sugestão, ou faria uma lista diferente? Entre em contato:</p>

      <!-- Formulário de Contato -->
      <form action="#" method="post">
        
        <!-- Campo: Nome -->
        <p>
          <label for="nome">Nome:</label><br>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </p>

        <!-- Campo: E-mail -->
        <p>
          <label for="email">E-mail:</label><br>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </p>

        <!-- Campo: Assunto -->
        <p>
          <label for="assunto">Assunto:</label><br>
          <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto da mensagem" required>
        </p>

        <!-- Campo: Comentário -->
        <p>
          <label for="comentario">Comentário:</label><br>
          <textarea id="comentario" name="comentario" rows="5" cols="40" placeholder="Escreva sua mensagem aqui..." required></textarea>
        </p>

        <!-- Botão de Envio -->
        <p>
          <button type="submit">Enviar Mensagem</button>
        </p>

      </form>
    </section>
  </main>

  <!-- Rodapé básico da página -->
  <footer>
    <p>&copy; 2026 Projeto Batata — Desenvolvido para fins acadêmicos.</p>
  </footer>

</body>
</html>
